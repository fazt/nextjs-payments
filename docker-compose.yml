services:
  db:
    image: postgres:17-alpine
    container_name: nextjs-payments-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fazt
      POSTGRES_PASSWORD: faztpassword
      POSTGRES_DB: nextfulldb
    ports:
      - "5463:5432"
    volumes:
      - nextjs-payments-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fazt -d nextfulldb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nextjs-payments-data:
